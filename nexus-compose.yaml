version: "3.8"

services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus-repository
    ports:
      - "8081:8081" # Interfaz Web
      - "5000:5000" # Docker Registry
      - "5003:5003" # Docker Group
    volumes:
      - nexus-data:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1200m -Xmx1200m -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    restart: unless-stopped

volumes:
  nexus-data:
    driver: local
