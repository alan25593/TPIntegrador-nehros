server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location /public/ {
        alias /usr/share/nginx/html/public/;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
}
